<!-- header -->
<header
  class="fixed inset-x-4 z-1000 top-4 h-16 bg-(--color-surface) border-1 border-solid border-(--color-border) rounded-full"
>
  <!-- container -->
  <div class="flex justify-between items-center max-w-7xl h-full mx-auto px-6">
    <!-- logo -->
    <a href="{% url 'home' %}" class="flex justify-center items-center gap-2">
      <!-- icon logo -->
      <!-- text logo -->
      <span
        class="bg-linear-to-r from-(--color-primary) to-(--color-secondary) bg-clip-text text-transparent text-4xl font-black"
      >
        آرتی گیم
      </span>
    </a>
    <!-- container menu bar -->
    <div class="flex justify-center items-center gap-6">
      <!-- button mega menu -->
      <button
        href="#"
        class="flex justify-center items-center gap-2 font-semibold transition-all duration-250 cursor-pointer hover:text-(--color-primary) active:text-(--color-secondary)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
        <span>دسته‌ بندی‌ها</span>
      </button>
      <!-- navigation bar -->
      <nav>
        <!-- list items -->
        <ul class="flex items-center justify-center gap-6">
          <!-- item -->
          <li>
            <!-- link home page -->
            <a
              href="{% url 'home' %}"
              class="flex justify-center items-center gap-2 font-semibold transition-all duration-250 hover:text-(--color-primary) active:text-(--color-secondary)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                />
              </svg>
              <span>خانه</span>
            </a>
          </li>
          <!-- item -->
          <li>
            <!-- link about us -->
            <a
              href="{% url 'about_us' %}"
              class="flex justify-center items-center gap-2 font-semibold transition-all duration-250 hover:text-(--color-primary) active:text-(--color-secondary)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
                />
              </svg>
              <span>درباره ما</span>
            </a>
          </li>
          <!-- item -->
          <li>
            <!-- link contact us -->
            <a
              href="{% url 'contact_us' %}"
              class="flex justify-center items-center gap-2 font-semibold transition-all duration-250 hover:text-(--color-primary) active:text-(--color-secondary)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
                />
              </svg>
              <span>تماس با ما</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
    <!-- container search -->
    <form
      action="#"
      method="get"
      class="flex justify-center items-center w-80 h-10 bg-(--color-surface-elevated) outline-2 outline-offset-2 outline-transparent rounded-full transition-all duration-250 shadow-md focus-within:outline-(--color-primary)"
    >
      <!-- button search -->
      <button
        type="submit"
        class="flex justify-center items-center w-10 h-full bg-(--color-primary) rounded-r-full text-(--color-white) transition-all duration-250 cursor-pointer hover:bg-(--color-primary-hover)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
      </button>
      <!-- input search -->
      <input
        type="search"
        class="grow h-full px-2 placeholder-(--color-text-secondary) rounded-l-full outline-none"
        placeholder="جستوحو"
      />
    </form>
    <!-- container actions -->
    <div class="flex justify-center items-center gap-2">
      <!-- action theme -->
      <div class="relative flex justify-center items-center group">
        <!-- button theme -->
        <button
          type="button"
          class="flex justify-center items-center p-2 rounded-full transition-all duration-250 cursor-pointer hover:bg-(--color-surface-hover)"
          id="theme-toggle"
        >
          <!-- system icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
            id="system-icon"
          >
            <path
              fill-rule="evenodd"
              d="M2.25 5.25a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3V15a3 3 0 0 1-3 3h-3v.257c0 .597.237 1.17.659 1.591l.621.622a.75.75 0 0 1-.53 1.28h-9a.75.75 0 0 1-.53-1.28l.621-.622a2.25 2.25 0 0 0 .659-1.59V18h-3a3 3 0 0 1-3-3V5.25Zm1.5 0v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5Z"
              clip-rule="evenodd"
            />
          </svg>
          <!-- moon icon  -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
            id="moon-icon"
          >
            <path
              fill-rule="evenodd"
              d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"
              clip-rule="evenodd"
            />
          </svg>
          <!-- sun icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
            id="sun-icon"
          >
            <path
              d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"
            />
          </svg>
        </button>
        <span
          class="absolute inset-x-auto top-full w-max mt-4 p-2 text-xs bg-(--color-surface-elevated) rounded-full invisible opacity-0 transition-all duration-250 pointer-events-none shadow-lg group-hover:visible group-hover:opacity-100"
          >ظاهر سایت</span
        >
        <!-- drop down themes -->
        <div
          class="absolute inset-x-auto top-full flex flex-col justify-center items-center mt-6 p-2 bg-(--color-surface-elevated) rounded-2xl invisible opacity-0 transition-all duration-250 shadow-md"
          id="list-themes"
        >
          <!-- system theme -->
          <button
            type="button"
            class="flex justify-center items-center gap-2 w-full py-1 px-2 rounded-full transition-all duration-250 cursor-pointer hover:bg-(--color-surface-hover)"
            data-theme-value="system"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
            >
              <path
                fill-rule="evenodd"
                d="M2.25 5.25a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3V15a3 3 0 0 1-3 3h-3v.257c0 .597.237 1.17.659 1.591l.621.622a.75.75 0 0 1-.53 1.28h-9a.75.75 0 0 1-.53-1.28l.621-.622a2.25 2.25 0 0 0 .659-1.59V18h-3a3 3 0 0 1-3-3V5.25Zm1.5 0v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5Z"
                clip-rule="evenodd"
              />
            </svg>
            <span class="grow">سیستم</span>
          </button>
          <!-- dark theme -->
          <button
            type="button"
            class="flex justify-center items-center gap-2 w-full py-1 px-2 rounded-full transition-all duration-250 cursor-pointer hover:bg-(--color-surface-hover)"
            data-theme-value="dark"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
            >
              <path
                fill-rule="evenodd"
                d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"
                clip-rule="evenodd"
              />
            </svg>
            <span class="grow">تاریک</span>
          </button>
          <!-- light theme -->
          <button
            type="button"
            class="flex justify-center items-center gap-2 w-full py-1 px-2 rounded-full transition-all duration-250 cursor-pointer hover:bg-(--color-surface-hover)"
            data-theme-value="light"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
            >
              <path
                d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"
              />
            </svg>
            <span class="grow">روشن</span>
          </button>
        </div>
      </div>
      <!-- link cart -->
      <div class="relative group flex justify-center items-center">
        <a
          href="#"
          class="flex justify-center items-center p-2 rounded-full transition-all duration-250 cursor-pointer hover:bg-(--color-surface-hover)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6"
          >
            <path
              d="M2.25 2.25a.75.75 0 0 0 0 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 0 0-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 0 0 0-1.5H5.378A2.25 2.25 0 0 1 7.5 15h11.218a.75.75 0 0 0 .674-.421 60.358 60.358 0 0 0 2.96-7.228.75.75 0 0 0-.525-.965A60.864 60.864 0 0 0 5.68 4.509l-.232-.867A1.875 1.875 0 0 0 3.636 2.25H2.25ZM3.75 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM16.5 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z"
            />
          </svg>
        </a>
        <span
          class="absolute inset-x-auto top-full w-max mt-4 p-2 text-xs bg-(--color-surface-elevated) rounded-full invisible opacity-0 transition-all duration-250 pointer-events-none shadow-lg group-hover:visible group-hover:opacity-100"
          >سبد خرید</span
        >
      </div>
      <!-- user -->
      <div class="flex justify-center items-center">
        <a
          href="#"
          class="flex justify-center items-center py-1 px-3 bg-(--color-secondary) border-1 border-transparent rounded-full transition-all duration-250 hover:bg-transparent hover:border-(--color-secondary-hover)"
          >ورود/ثبت نام</a
        >
      </div>
    </div>
  </div>
</header>
